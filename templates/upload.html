<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Upload Tender File | FundGuard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary px-3">
  <a class="navbar-brand d-flex align-items-center" href="#">
    <img src="{{ url_for('static', filename='logo.png') }}" class="me-2" alt="FundGuard Logo" style="height:40px;">
    <span class="fw-bold">FundGuard</span>
  </a>
</nav>

<!-- Upload Section -->
<div class="container mt-5">
  <div class="card p-4">
    <h3 class="text-center text-primary mb-4">📁 Upload Tender File</h3>
    <form action="/upload" method="POST" enctype="multipart/form-data">
      <input type="file" name="file" class="form-control mb-3" required>
      <button class="btn btn-primary w-100">🚀 Submit & Analyze</button>
    </form>
  </div>
</div>
<!-- Floating Chat Button -->
<button id="toggleChatBtn" class="btn btn-dark position-fixed" style="bottom: 20px; right: 20px; z-index: 9999;">
  🤖 Ask FundBot
</button>

<!-- Chatbot Box -->
<div id="chatbotBox" class="chatbot-box p-3 bg-light border rounded shadow-lg position-fixed"
     style="bottom: 80px; right: 20px; width: 300px; z-index: 1000; display: none;">
  <strong>Ask FundGuard 🤖</strong><br>
  <input type="text" id="chatInput" placeholder="Ask about tenders, flags, or clauses..." class="form-control my-2">
  <button onclick="chatWithAI()" class="btn btn-sm btn-dark w-100">Ask</button>
  <div id="chatResponse" class="mt-3 p-2 border rounded bg-white" style="display: none;"></div>
</div>
<script>
  // Toggle ChatBot Visibility
  const chatToggleBtn = document.getElementById("toggleChatBtn");
  const chatbotBox = document.getElementById("chatbotBox");

  chatToggleBtn.addEventListener("click", () => {
    chatbotBox.style.display = chatbotBox.style.display === "none" ? "block" : "none";
  });

  // Chatbot Function
  async function chatWithAI() {
    const input = document.getElementById("chatInput").value.trim();
    const responseBox = document.getElementById("chatResponse");
    if (!input) return;
    responseBox.style.display = "block";
    responseBox.innerHTML = "<em>🤖 Thinking...</em>";
    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt: input })
      });
      const data = await res.json();
      responseBox.innerHTML = `<strong>FundBot:</strong> ${data.reply}`;
    } catch (err) {
      responseBox.innerHTML = "❌ Error connecting to FundBot.";
    }
  }
</script>

</body>
</html>
